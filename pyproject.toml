[tool.poetry]
name = "bank_masking_project"
version = "0.2.0"
description = "Project reading JSON, CSV, XLSX"
authors = ["Allen <...>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31.0"
pandas = "^2.0.0"
openpyxl = "^3.1.2"  # для чтения xlsx

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
pytest-cov = "^6.0.0"
mypy = "^1.5.1"
flake8 = "^6.1.0"
types-requests = "^2.31.0.6"  # чтобы mypy не ругался на requests

[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"
